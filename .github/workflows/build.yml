name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUDGE_KEYSTORE_PASSWORD: ${{ secrets.NUDGE_KEYSTORE_PASSWORD }}
      NUDGE_KEY_ALIAS: ${{ secrets.NUDGE_KEY_ALIAS }}
      NUDGE_KEY_PASSWORD: ${{ secrets.NUDGE_KEY_PASSWORD }}
      # SHA-256 of the permanent signing certificate (public, not secret).
      EXPECTED_CERT_SHA256: 6558a16a466c2da19318a7a8cbd20105c82323ea045a09f947fc0ac8a05f2ce8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradlew in the repo yet, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing - refusing to build an APK that can't update the installed app"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nudge.jks"
          echo "NUDGE_KEYSTORE_PATH=$RUNNER_TEMP/nudge.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK is signed with the permanent key
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt || { echo "::error::APK signed with wrong key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nudge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
